server:
  port: 8082
  servlet:
    context-path: /api/products


app:
  openapi:
    enabled: true
    title: "Product Service API"
    description: "Product Management Service"
    version: "1.0.0"

spring:
  application:
    name: product-service
  docker:
    compose:
      enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/product_db
    username: ecommerce
    password: admin
  mvc:
    servlet:
      load-on-startup: 1
  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.app: DEBUG
