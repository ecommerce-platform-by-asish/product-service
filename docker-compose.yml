name: ecommerce-app
services:
  postgres:
    image: postgres:17-alpine
    container_name: product-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: product_db
    ports:
      - "5433:5432"

  redis:
    image: redis:7.4-alpine
    container_name: product-redis
    ports:
      - "6380:6379"
